name: Access test
on: workflow_dispatch
permissions:
  contents: read
  models: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Discover2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          UA="Mozilla/5.0"
          B="https://www.president.go.kr"
          echo "=== 청와대 board.js 데이터 호출 부분"
          curl -sL -m 30 -A "$UA" "$B/type/common/js/board.js" -o board.js
          grep -nE "ajax|url|fetch|\.json|/api|\.do|getJSON" board.js | cut -c1-220 | head -30
          echo "=== 청와대 페이지 안에 적힌 주소"
          curl -sL -m 30 -A "$UA" "$B/briefings" | grep -oE "(\"|')/[A-Za-z0-9_./-]*(api|list|board|briefing|schedule)[A-Za-z0-9_./?=&-]*(\"|')" | sort -u | head -20
          echo "=== GitHub Models 재시험"
          curl -s -m 60 -o m.txt -w "http=%{http_code}\n" https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"한국어로 한 문장 인사해줘"}],"max_tokens":60}'
          head -c 700 m.txt
          echo
          exit 0
